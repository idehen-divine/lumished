services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Run as mysql user (999) to skip entrypoint chown which fails under userns-remap/root_squash
    # Data dir is pre-chowned to 999:999 via deploy.sh (docker alpine), so no chown needed
    user: "999:999"

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - ${DATA_DIR:-./data}/mysql:/var/lib/mysql

    networks:
      - lumished-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="${DB_ROOT_PASSWORD}" mysql -u root -e ''SELECT 1'' >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"

    volumes:
      - ${DATA_DIR:-./data}/redis:/data

    networks:
      - lumished-network

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "127.0.0.1:${MINIO_PORT}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:9001"

    volumes:
      - ${DATA_DIR:-./data}/minio:/data

    networks:
      - lumished-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  lumished-network:
    name: lumished-network
    driver: bridge
