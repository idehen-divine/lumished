services:
    app:
        build:
            context: .
        image: ${APP_ENV}-app
        container_name: ${APP_ENV}-app
        restart: unless-stopped
        env_file: .env
        volumes:
            - ${DATA_DIR:-/opt/shelfie/data}/logs:/var/www/html/storage/logs
        networks:
            - shelfie-shared

    queue:
        image: ${APP_ENV}-app
        container_name: ${APP_ENV}-queue
        restart: unless-stopped
        env_file: .env
        command: php artisan queue:work --sleep=3 --tries=3 --max-jobs=500 --max-time=1800
        volumes:
            - ${DATA_DIR:-/opt/shelfie/data}/logs:/var/www/html/storage/logs
        networks:
            - shelfie-shared

    scheduler:
        image: ${APP_ENV}-app
        container_name: ${APP_ENV}-scheduler
        restart: unless-stopped
        env_file: .env
        command: >
            /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
        volumes:
            - ${DATA_DIR:-/opt/shelfie/data}/logs:/var/www/html/storage/logs
        networks:
            - shelfie-shared

networks:
    shelfie-shared:
        external: true
