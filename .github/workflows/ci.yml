name: CI

on:
  push:
    branches: [main, master, develop, stage]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP 8.4)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, gd, intl, bcmath, redis, imagick, exif
          coverage: none
          tools: composer:v2

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Generate application key
        run: php artisan key:generate

      - name: Clear config cache
        run: php artisan config:clear

      - name: Run tests
        run: php artisan test --compact
        # Alternative: composer test (runs config:clear + artisan test) — exit code propagates

  # Optional integration job — e.g., separate e2e / browser tests that depend on `tests` passing.
  # Uncomment and customize if needed; single `tests` job is sufficient for CI.
